[project]
name = "affine-interviewer-server"
version = "0.1.0"
description = "AFFINE 2026 interviewer — FastAPI + Anthropic API, serves the wiki and runs the two-phase interview"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.9.0",
    "markdown>=3.7",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
]

[tool.uv]
package = false
